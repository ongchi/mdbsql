[package]
name = "libmdb-sys"
version = "0.2.0"
edition = "2021"
description = "Native bindings to the libmdb/libmdbsql library"
license = "Apache-2.0 AND LGPL-2.0-or-later"
keywords = ["libmdb", "libmdbsql", "ffi"]
categories = ["external-ffi-bindings"]
links = "mdbsql"

[features]
default = []
bundled = ["dep:cc"]
# Run bindgen for the bundled library instead of using pre-generated bindings
buildtime_bindgen = []

[dependencies]
libc = "0.2"

[build-dependencies]
bindgen = "0.72"
cc = { version = "1.2", optional = true }
pkg-config = "0.3"
