[package]
name = "mdbsql"
version = "0.1.8"
edition = "2021"
description = "SQL query for Access database on Unix-like systems and Windows"
readme = "README.md"
keywords = ["access", "mdb", "database", "ffi"]
license = "Apache-2.0"
categories = ["database"]
repository = "https://github.com/ongchi/mdbsql"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[workspace]
members = ["libmdb-sys"]

[lib]
name = "mdbsql"

[features]
default = []
rusqlite = ["dep:rusqlite"]
bundled = ["libmdb-sys/bundled"]
buildtime_bindgen = ["libmdb-sys/buildtime_bindgen"]

[dependencies]
libc = "0.2"
libmdb-sys = { version = "0.2.0", path = "libmdb-sys" }
rusqlite = { version = "0.38", optional = true, features = ["bundled"] }
serde = "1.0"
serde_plain = "1.0"
thiserror = "2.0"

[build-dependencies]
version-compare = "0.2"
